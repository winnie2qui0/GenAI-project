services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
      POSTGRES_DB: procurement_db
    ports:
      - "5432:5432"
    volumes:
      - procurement_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./procurement-system/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://procurement:procurement@postgres:5432/procurement_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  procurement_pg:
